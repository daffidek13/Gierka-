<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14161b">
<title>Roguelike – etap 5</title>
<style>
:root{--bg:#14161b;--ink:#e9e4d6;--amber:#e0a63a;--red:#d9604c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Palatino Linotype",Palatino,Georgia,serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
header{display:flex;justify-content:space-between;align-items:center}
#loc b{font-size:20px;display:block}
#loc span{font-size:13px;opacity:.7}
#mini{display:grid;grid-template-columns:repeat(3,20px);gap:2px;padding:4px;background:#0c0d10;border:1px solid #3a3d46;border-radius:8px}
#mini i{width:20px;height:20px;border-radius:3px}
#mini i.me{outline:2px solid var(--amber);outline-offset:-2px}
#field{flex:1;position:relative;overflow:hidden;border-radius:14px;isolation:isolate}
#view{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:28px 12px 22px}
#view img.tile{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#poi,#foes{position:relative;z-index:1}
#poi{text-align:center;font-size:18px}
#poi .ic{font-size:64px;display:block;position:relative}
#foes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.foe{width:80px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:center;position:relative}
.foe .ic{font-size:44px;display:block;position:relative;height:56px;filter:drop-shadow(0 3px 2px #0008)}
.foe .ic::after{content:"";position:absolute;left:10%;right:10%;bottom:-4px;height:10px;border-radius:50%;background:#0006;z-index:-1}
.foe.ag .ic::after{background:#d9604c99;box-shadow:0 0 10px #d9604c}
.foe b{position:absolute;top:0;right:4px;background:#000b;border-radius:10px;padding:1px 7px;font-size:14px;z-index:2}
.foe small{display:block;font-size:12px;margin-top:6px;text-shadow:0 1px 2px #000}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#hint{text-align:center;font-size:13px;color:#a9a69b}
#hint button{font:inherit;font-size:14px;padding:8px 14px;margin:0 4px;border-radius:10px;border:1px solid #4a4e59;background:#1d2027;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;background:#0b0c0fee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:4;padding:20px}
#ov.on{display:flex}
#ov button{font:inherit;font-size:16px;padding:10px 18px;border-radius:10px;border:1px solid #4a4e59;background:#1d2027;color:var(--ink)}
#ov .row{display:flex;gap:10px}
#ov p{margin:0;font-size:14px;opacity:.7}
#fight{position:fixed;inset:0;z-index:3;display:none;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg)}
#fight.on{display:flex}
#fcnt{text-align:center;font-size:22px}
#fe{flex:1;display:flex;align-items:center;justify-content:center;border-radius:14px}
#fico .ic{font-size:88px;display:block;position:relative;width:120px;height:120px;line-height:120px;text-align:center;filter:drop-shadow(0 4px 4px #0008)}
#flog{min-height:20px;text-align:center;font-size:14px;opacity:.85}
.bar{position:relative;height:20px;background:#000a;border-radius:6px;overflow:hidden}
.bar u{position:absolute;inset:0 auto 0 0;display:block;background:#b33;transition:width .1s}
.bar.m u{background:#3b7ddd}.bar.s u{background:#d19a2a}.bar.h u{background:#3aa655}
.bar span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:20px;text-shadow:0 1px 2px #000}
#skills{display:flex;gap:8px}
#skills button,#flee{font:inherit;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid #4a4e59;background:#1d2027;color:var(--ink);position:relative;overflow:hidden}
#skills button{flex:1}
#skills button i{position:absolute;inset:0 0 auto 0;background:#000a;height:0}
#foes{position:absolute;inset:0;display:block;pointer-events:none}
.foe{position:absolute;pointer-events:auto;transform-origin:50% 85%}
.pg{position:fixed;inset:0;z-index:6;background:#0b0c0f;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);touch-action:pan-y;font-size:15px}
.pg.on{display:block}.pg h3{margin:14px 0 6px;font-size:17px}.pg p{margin:3px 0}
.pg button{font:inherit;font-size:14px;padding:7px 12px;margin:3px 0;border-radius:9px;border:1px solid #4a4e59;background:#1d2027;color:var(--ink)}
.pg .it{display:block;width:100%;text-align:left}.pg .cb{display:block;width:100%;text-align:left;padding:12px}
#chb{font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid #4a4e59;background:#1d2027;color:var(--ink)}
#fauto{font:inherit;font-size:14px;padding:10px 4px;border-radius:10px;border:1px solid #4a4e59;background:#1d2027;color:var(--ink)}
#skills{flex-wrap:wrap}#skills button{flex:1 1 28%}
#tv{overflow:auto;height:calc(100vh - 230px);border:1px solid #2a2d35;border-radius:10px;touch-action:pan-x pan-y}
#ti{min-height:64px;margin:6px 0;font-size:14px}
.pg .nd{position:absolute;width:58px;height:46px;margin:0;padding:2px;font-size:10px;line-height:1.1;border-radius:50%;background:#1d2027;border:2px solid #3a3d46;color:var(--ink);overflow:hidden}
.pg .nd.a{border-radius:8px}.pg .nd.own{background:#7a5a1a;border-color:#e0a63a}.pg .nd.av{border-color:#9fd36a}.pg .nd.sel{outline:2px solid #fff}
#chr{background:radial-gradient(120% 70% at 50% 0%,#2b2115,#0e0b08)}
#chr h3{color:#d9b26a;font-weight:normal;letter-spacing:.5px;border-bottom:1px solid #5a4630;padding-bottom:4px;margin:18px 0 8px}
.ttl{margin:12px 0 8px;font-size:22px;color:#f0dcae;font-weight:normal}
.hd{display:flex;gap:8px;justify-content:space-between}
.bar.x u{background:#8a5bd0}.bar{margin:4px 0}
.chips{display:flex;gap:8px;margin:8px 0}.chips span{background:#1e1913;border:1px solid #5a4630;border-radius:20px;padding:4px 12px}
.pg .wide{width:100%}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sc{background:#1e1913;border:1px solid #5a4630;border-radius:10px;padding:8px 10px}.sc small{display:block;opacity:.7}.sc b{font-size:18px;color:#f0dcae}
.at{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #5a4630;border-radius:10px;margin:5px 0;background:#1e1913}.at small{opacity:.65}
.pg .plus{width:44px;height:44px;border-radius:50%;font-size:24px;padding:0;margin:0;background:#2f6b36;border-color:#8fd18a}
.dl{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center}.bg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pg .tl{position:relative;width:100%;aspect-ratio:1;padding:0;margin:0;border:2px solid var(--c,#4a3f2e);border-radius:10px;background:linear-gradient(160deg,#2a2218,#17130e);overflow:hidden;box-shadow:inset 0 0 12px #0008}
.pg .tl.on{outline:2px solid #fff;outline-offset:1px}
.tl .ic{position:relative;display:block;font-size:28px;line-height:1;height:100%;display:flex;align-items:center;justify-content:center}
.tl .ph{font-size:10px;opacity:.45;display:block;padding:4px;line-height:1.15}
.tl i{position:absolute;left:0;bottom:0;height:3px;background:#6ac46a}.tl em{position:absolute;top:1px;right:5px;color:#ff6b5a;font-style:normal;font-weight:bold}
.em{aspect-ratio:1;border:1px dashed #3a3226;border-radius:10px}
#idet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#1b150d;border-top:2px solid #b58b3c;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);font-size:14px;box-shadow:0 -8px 20px #000a}
#idet b{font-size:17px}#idet small{display:block;opacity:.7;margin:2px 0 6px}#idet .row{display:flex;gap:8px;margin-top:8px}#idet .row button{flex:1;padding:10px}
#hero{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:52px;height:84px;z-index:90;pointer-events:none;filter:drop-shadow(0 3px 3px #000a)}
#fe{position:relative;flex-direction:column;justify-content:space-around}#fhero{width:68px;height:110px;filter:drop-shadow(0 3px 3px #000a)}
.hrow{display:flex;gap:12px;align-items:center;margin:6px 0}.hv{width:110px;flex:none}.hb{flex:1}
.tl .sb{position:absolute;top:0;left:4px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="loc"><b id="tname"></b><span id="coords"></span></div>
    <button id="mini" aria-label="Otwórz mapę" style="color:inherit"></button>
  </header>
  <main id="field"><div id="view"><div id="poi"></div><div id="foes"></div><div id="hero"></div></div></main>
  <div id="hint">Przesuń palcem, żeby przejść na sąsiednie pole</div>
<button id="chb">Postać i plecak</button></div>
<div id="fight"><div id="fcnt"></div><div class="bar e"><u id="ebar"></u><span id="etxt"></span></div><div id="fe"><span id="fico"></span><div id="fhero"></div></div><div id="flog"></div>
<div class="bar h"><u id="hbar"></u><span id="htxt"></span></div><div class="bar m"><u id="mbar"></u><span id="mtxt"></span></div><div class="bar s"><u id="sbar"></u><span id="stxt"></span></div>
<div id="skills"></div><button id="fauto">Autoclick</button><button id="flee">Uciekaj</button></div>
<div id="chr" class="pg"></div><div id="town" class="pg"></div><div id="cls" class="pg"></div><div id="tree" class="pg"></div>
<div id="toast"></div>
<div id="ov">
  <canvas id="mapc"></canvas>
  <p id="mapinfo"></p>
  <div class="row"><button id="close">Zamknij</button><button id="reset">Nowy świat</button></div>
</div>

<script>
// ---------- konfiguracja ----------
const T={
  woda:{n:'Woda',c:'#2f5d7c',c2:'#24495f',ok:false},
  laka:{n:'Łąka',c:'#6f9440',c2:'#557a30'},
  las:{n:'Las',c:'#2f6238',c2:'#234a2a'},
  gory:{n:'Góry',c:'#80796c',c2:'#5f5a50'},
  bagno:{n:'Bagno',c:'#5d6e45',c2:'#46553a'},
  pustynia:{n:'Pustynia',c:'#bb9a52',c2:'#96783c'}
};
const E={szkielet:['Szkielet','💀'],ork:['Ork','👹'],wilk:['Wilk','🐺'],goblin:['Goblin','👺'],pajak:['Pająk','🕷️'],troll:['Troll','🧌'],smok:['Smok','🐉'],skorpion:['Skorpion','🦂'],topielec:['Topielec','🧟']};
const SP={laka:['wilk','goblin'],las:['pajak','ork','wilk'],gory:['ork','troll'],bagno:['topielec','szkielet'],pustynia:['szkielet','skorpion']};
const SLOT=[[26,66],[74,66],[50,46],[18,44],[82,44]],slot=i=>SLOT[i%5];
const POI={miasto:['Miasto','🏰'],jaskinia:['Jaskinia','🕳️'],ruiny:['Ruiny','🏚️']};
// Miejsca na Twoje grafiki: assets/tiles/<teren>.png, assets/enemies/<klucz>.png, assets/poi/<klucz>.png
// Jeśli pliku nie ma, widać emoji i kolor (placeholder).

// ---------- generator świata ----------
function h(x,y,s){let n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vn(x,y,sc,s){const gx=x/sc,gy=y/sc,x0=Math.floor(gx),y0=Math.floor(gy);let fx=gx-x0,fy=gy-y0;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=h(x0,y0,s),b=h(x0+1,y0,s),c=h(x0,y0+1,s),d=h(x0+1,y0+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
const cache=new Map();
function field(x,y){
  const k=x+','+y,s=S.seed+(S.map||0)*7919;if(cache.has(k))return cache.get(k);
  const e=.65*vn(x,y,8,s)+.35*vn(x,y,3,s+1),m=vn(x,y,10,s+2);
  let t=e<.3?'woda':e>.72?'gory':m<.3?'pustynia':m>.7?'bagno':m>.5?'las':'laka';
  if(Math.abs(x)<=1&&Math.abs(y)<=1)t='laka';
  const f={x,y,t,poi:null,foes:[]};
  if(x===0&&y===0)f.poi='miasto';
  else if(t!=='woda'){
    const r=h(x,y,s+10);
    if(r<.1)f.poi='jaskinia';else if(r<.15)f.poi='ruiny';
    if(h(x,y,s+11)<.55){
      const n=1+Math.floor(h(x,y,s+12)*3);
      for(let i=0;i<n;i++){
        let list=SP[t],key=list[Math.floor(h(x+i*7,y+i*13,s+20)*list.length)];
        if(t==='gory'&&h(x+i,y,s+30)<.04)key='smok';
        f.foes.push({key,ag:h(x+i*5,y+i*3,s+40)<.4,n:key==='smok'?1:1+Math.floor(h(x+i*3,y+i*11,s+50)*5),px:[20,50,80][(i+Math.floor(h(x,y,s+60)*3))%3]+(h(x+i,y,s+61)-.5)*12,py:48+h(x,y+i,s+62)*32});
      }
    }
  }
  if(S.boss&&!S.boss.dead&&x===S.boss.x&&y===S.boss.y){f.t=f.t==='woda'?'laka':f.t;f.poi=null;f.foes=[{key:'boss',ag:true,n:1,px:50,py:62,boss:1}]}
  cache.set(k,f);return f;
}

// ---------- stan i zapis ----------
let S;
function newGame(){S={seed:Math.floor(Math.random()*1e9),x:0,y:0,visited:{'0,0':1},steps:0,p:{lvl:1,xp:0,hp:100,mana:50,sta:50},dead:{}};cache.clear();save()}
function save(){try{localStorage.setItem('rl-save',JSON.stringify(S))}catch(e){}}
try{S=JSON.parse(localStorage.getItem('rl-save'))}catch(e){S=null}
if(!S||typeof S.seed!=='number')newGame();
S.p=S.p||{lvl:1,xp:0,hp:100,mana:50,sta:50};S.dead=S.dead||{};

// ---------- widok ----------
const $=id=>document.getElementById(id);
function icon(cls,path,emoji){return `<span class="ic"><span class="ej">${emoji}</span><img src="${path}" alt="" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()"></span>`}
function render(dx=0,dy=0){
  const fo=field(S.x,S.y),f=cur(),t=T[f.t],v=$('view');
  v.style.background=`linear-gradient(160deg,${t.c},${t.c2})`;
  v.querySelectorAll('img.tile').forEach(i=>i.remove());
  const im=new Image();im.className='tile';im.alt='';im.onerror=()=>im.remove();im.src=`assets/tiles/${f.t}.png`;v.prepend(im);
  $('hero').innerHTML=heroSvg();$('tname').textContent=f.poi==='miasto'?'Miasto':t.n;
  $('coords').textContent=`Pole ${S.x}, ${S.y} · poz. ${S.p.lvl} · HP ${Math.ceil(S.p.hp)}/${mh()} · mapa ${(S.map||0)+1}${bossHint()}`;
  $('poi').onclick=S.loc?null:fo.poi==='miasto'?openTown:fo.poi?()=>enterLoc(fo):null;$('poi').innerHTML=S.loc?icon('',`assets/poi/${S.loc.k}.png`,POI[S.loc.k][1])+POI[S.loc.k][0]+` · sala ${S.loc.room+1}/${S.loc.rooms}`:fo.poi?icon('',`assets/poi/${fo.poi}.png`,POI[fo.poi][1])+POI[fo.poi][0]+(fo.poi==='miasto'?'':(S.cleared&&S.cleared[ckey(fo)]?' (wyczyszczone)':' · tap, aby wejść')):'';
  $('foes').innerHTML=f.foes.map((o,i)=>isDead(f,i)?'':`<button class="foe${o.ag?' ag':''}" data-i="${i}" style="left:${slot(i)[0]}%;top:${slot(i)[1]}%;z-index:${slot(i)[1]};transform:translate(-50%,-85%) scale(${(.8+slot(i)[1]/100*.4).toFixed(2)})">${icon('',`assets/enemies/${o.key}.png`,E[o.key][1])}<b>×${o.n}</b><small>${E[o.key][0]}${o.ag?' · atakuje!':''}</small></button>`).join('');
  if(S.loc){v.style.background='linear-gradient(160deg,#34353f,#14151a)';v.querySelectorAll('img.tile').forEach(i=>i.remove())}
  $('hint').innerHTML=S.loc?`<button id="lnext">${S.loc.room>=S.loc.rooms-1?'Otwórz skrzynię':'Dalej'}</button><button id="lexit">Wyjdź</button>`:'Przesuń palcem, żeby przejść na sąsiednie pole';
  // minimapa 3x3
  let m='';
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    const g=field(S.x+i,S.y+j),seen=S.visited[(S.x+i)+','+(S.y+j)]||(i===0&&j===0);
    m+=`<i class="${i===0&&j===0?'me':''}" style="background:${T[g.t].c};opacity:${seen?1:.35}"></i>`;
  }
  $('mini').innerHTML=m;
  if(dx||dy)v.animate([{transform:`translate(${dx*50}px,${dy*50}px)`,opacity:.2},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'});
}
let tt;function toast(s,ms){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),ms||2600)}

function move(dx,dy){if(S.loc||F)return;
  const nx=S.x+dx,ny=S.y+dy,f=field(nx,ny);
  if(T[f.t].ok===false){toast('Woda blokuje drogę');return}
  S.px=S.x;S.py=S.y;S.x=nx;S.y=ny;{const p=S.p;p.hp=Math.min(mh(),p.hp+3);p.mana=mm();p.sta=sm()}S.visited[nx+','+ny]=1;S.steps++;spawnWd(f);save();render(dx,dy);
  (S.p.q||[]).forEach(q=>{if(q.t==='reach')q.have=Math.min(q.need,Math.max(q.have,Math.round(Math.hypot(S.x,S.y))))});S.ms=(S.ms||0)+1;if(!S.boss&&S.ms>=1000&&Math.random()<.015)spawnBoss();
  const fc=cur(),a=fc.foes.findIndex((o,i)=>o.ag&&!isDead(fc,i));if(a>=0)startFight(a,true);
}

// ---------- sterowanie: swipe ----------
let p0=null;const fld=$('field');
fld.addEventListener('pointerdown',e=>{p0={x:e.clientX,y:e.clientY}});
fld.addEventListener('pointerup',e=>{
  if(!p0||S.loc||F){p0=null;return}const dx=e.clientX-p0.x,dy=e.clientY-p0.y;p0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
  // przeciągnięcie mapy w lewo = idziesz na wschód, w górę = na południe
  if(Math.abs(dx)>Math.abs(dy))move(dx<0?1:-1,0);else move(0,dy<0?1:-1);
});
fld.addEventListener('click',e=>{const b=e.target.closest('.foe');if(b)startFight(+b.dataset.i)});
addEventListener('keydown',e=>{const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k)move(...k)});

// ---------- pełna mapa ----------
function openMap(){
  const keys=Object.keys(S.visited).map(k=>k.split(',').map(Number));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  keys.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  x0--;y0--;x1++;y1++;
  const w=x1-x0+1,hh=y1-y0+1,box=Math.min(innerWidth-40,innerHeight-220,380),cs=Math.max(4,Math.min(28,Math.floor(box/Math.max(w,hh))));
  const c=$('mapc');c.width=w*cs;c.height=hh*cs;const g=c.getContext('2d');
  g.fillStyle='#0e1014';g.fillRect(0,0,c.width,c.height);
  keys.forEach(([x,y])=>{
    const f=field(x,y),px=(x-x0)*cs,py=(y-y0)*cs;
    g.fillStyle=T[f.t].c;g.fillRect(px,py,cs,cs);
    if(f.poi){g.fillStyle=f.poi==='miasto'?'#fff':'#000';g.beginPath();g.arc(px+cs/2,py+cs/2,Math.max(2,cs/5),0,7);g.fill()}
  });
  g.strokeStyle='#e0a63a';g.lineWidth=2;g.strokeRect((S.x-x0)*cs+1,(S.y-y0)*cs+1,cs-2,cs-2);

['h4','Święty wojownik','s9,w4','p',{hpp:10,atkp:6}],['h5','Dusza walki','h2,h3','a',{t:'b',r:'mana',c:40,cd:22,m:1.6,d:10}],['h6','Ostateczna forma','h5,h4','p',{sil:3,zre:3,int:3,wit:3}]];
const TN={};TR.forEach(r=>TN[r[0]]={id:r[0],n:r[1],par:r[2]?r[2].split(','):[],t:r[3],e:r[4]});
const TD={},TP={};let TW=0,TZ=.8;
const dep=id=>TD[id]??(TD[id]=TN[id].par.length?1+Math.max(...TN[id].par.map(dep)):0);
(function(){const BX={s:-390,z:-130,i:130,w:390},rows={};
  Object.keys(TN).forEach(id=>{(rows[dep(id)]=rows[dep(id)]||[]).push(id)});
  Object.keys(rows).sort((a,b)=>a-b).forEach(d=>{const ids=rows[d];
    ids.forEach(id=>{const n=TN[id];TP[id]={x:!n.par.length?0:n.par[0]==='o'?BX[id[0]]:n.par.reduce((a,q)=>a+TP[q].x,0)/n.par.length,y:10+d*80}});
    ids.sort((a,b)=>TP[a].x-TP[b].x);
    for(let k=0;k<60;k++)for(let i=0;i<ids.length-1;i++){const A=TP[ids[i]],B=TP[ids[i+1]],g=66-(B.x-A.x);if(g>0){A.x-=g/2;B.x+=g/2}}});
  const xs=Object.values(TP).map(p=>p.x),mn=Math.min(...xs);Object.values(TP).forEach(p=>p.x+=40-mn);TW=Math.max(...xs)-mn+100;
})();
const SKL=()=>(S.p.lo||[]).map(id=>TN[id]).filter(Boolean);
function initTree(p){const c={uczony:'i',silacz:'s',atleta:'z'}[p.cls];p.tr=['o',c+'1',c+'2','w1','w2'];p.lo=[c+'2','w2'];p.ps=p.lvl-1}
function effTx(n){if(n.t==='p')return Object.entries(n.e).map(([k,v])=>'+'+v+' '+LB[k]).join(', ')||'Środek drzewka';const e=n.e;return `${{p:'Atak fizyczny',m:'Zaklęcie',h:'Leczenie',b:'Wzmocnienie ataku',s:'Tarcza'}[e.t]} · ${e.c} ${e.r==='mana'?'many':'staminy'} · CD ${e.cd}s · ×${e.m}${e.t==='h'||e.t==='s'?'% HP':''}`}
let TSEL=null;
function showTree(){
  const p=S.p,old=$('tv'),sl=old?[old.scrollLeft,old.scrollTop]:[Math.max(0,TP.o.x*TZ-innerWidth/2),0],own=id=>p.tr.includes(id),av=id=>!own(id)&&TN[id].par.some(own);
  let ln='',nd='',mx=0;
  Object.keys(TN).forEach(id=>{const n=TN[id],a=TP[id];mx=Math.max(mx,a.y);
    n.par.forEach(q=>{const b=TP[q];ln+=`<line x1="${b.x}" y1="${b.y+23}" x2="${a.x}" y2="${a.y+23}" stroke="${own(id)&&own(q)?'#e0a63a':'#444'}" stroke-width="3"/>`});
    nd+=`<button class="nd${n.t==='a'?' a':''}${own(id)?' own':av(id)?' av':''}${TSEL===id?' sel':''}" data-n="${id}" style="left:${a.x-29}px;top:${a.y}px">${n.n}</button>`});
  const n=TSEL&&TN[TSEL],lo=p.lo.includes(TSEL);
  $('tree').innerHTML=`<button data-a="tx">Zamknij</button> <button data-a="rs">Reset drzewka (${20*p.lvl} zł)</button> <button data-a="zm">−</button><button data-a="zp">+</button><p>Wolne punkty: <b>${p.ps}</b> · pasek walki: ${p.lo.map(i=>TN[i].n).join(', ')||'—'}</p>
  <div id="ti">${n?`<b>${n.n}</b> — ${effTx(n)}<br>${own(TSEL)?(n.t==='a'?`<button data-a="lo">${lo?'Zdejmij z paska':'Dodaj do paska (max 4)'}</button>`:'Odblokowane'):av(TSEL)?`<button data-a="un"${p.ps?'':' disabled'}>Odblokuj (1 pkt)</button>`:'Najpierw odblokuj sąsiedni węzeł'}`:'Tap w węzeł, żeby zobaczyć opis. Okrągłe: pasywki, kwadratowe: umiejętności aktywne.'}</div>
  <div id="tv"><div style="position:relative;zoom:${TZ};width:${TW}px;height:${mx+90}px"><svg width="${TW}" height="${mx+90}" style="position:absolute;inset:0">${ln}</svg>${nd}</div></div>`;
  $('tree').classList.add('on');const t=$('tv');t.scrollLeft=sl[0];t.scrollTop=sl[1];
}
$('tree').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=S.p,a=b.dataset.a;
  if(a==='tx'){$('tree').classList.remove('on');showChar();return}
  if(b.dataset.n)TSEL=b.dataset.n;
  else if(a==='zp')TZ=Math.min(1.4,TZ+.15);else if(a==='zm')TZ=Math.max(.5,TZ-.15);
  else if(a==='un'&&p.ps&&TSEL){const n=TN[TSEL];if(!p.tr.includes(TSEL)&&n.par.some(q=>p.tr.includes(q))){p.ps--;p.tr.push(TSEL);if(n.t==='a'&&p.lo.length<4)p.lo.push(TSEL)}}
  else if(a==='lo'){const i=p.lo.indexOf(TSEL);if(i>=0)p.lo.splice(i,1);else if(p.lo.length<4)p.lo.push(TSEL);else toast('Pasek ma max 4 umiejętności')}
  else if(a==='rs'){const c=20*p.lvl;if(p.gold<c){toast('Za mało złota');return}p.gold-=c;initTree(p)}
  p.hp=Math.min(p.hp,mh());save();showTree()};

if(S.p.cls&&!S.p.tr)initTree(S.p);
if(S.p.lo&&S.p.lo.length>4)S.p.lo.length=4;
render();
if(!S.p.cls)showCls();
</script>
</body>

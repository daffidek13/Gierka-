function riftEnd(ok){const R=RFT;RFT=null;if(!R)return;const p=S.p,lo=[],xg=Math.round(R.xp*(ok?1:.5)),up=xg>0?gainXp(xg):false,bt=Math.round((Date.now()-R.t0)/1000);let lb='Szczelina '+R.n;S.rec.sum=S.rec.sum||{};S.rec.sumU=S.rec.sumU||{};

const BRN={s:'Siła',z:'Zwinność',i:'Umysł',w:'Życie',n:'Mrok',p:'Natura',h:'Hybrydy'},BRI={s:'💪',z:'🌀',i:'🧠',w:'❤️',n:'💀',p:'🌿',h:'⚗️'},BRC={s:'#d2573d',z:'#4fb36e',i:'#4f8fe6',w:'#e0709f',n:'#9a5ad0',p:'#8fbf3a',h:'#e0b04a'},BRB={s:'Wojownik',z:'Zabójca',i:'Mag',w:'Obrońca',n:'Nekromanta',p:'Łowca',h:'Mistrz hybryd'};

function canBuy(id){const p=S.p,r=rk(id),m=mxOf(id);if(!brOk(id))return[false,`Niedostępne dla klasy ${CL[p.cls]?CL[p.cls][4]:''}${CLBR[p.cls]&&id[0]===CLBR[p.cls][1]?' (z tej gałęzi tylko 2 pierwsze poziomy)':''}`];if(r>=m)return[false,'Maksymalna ranga'];if(r===0){const c=cflOf(id);if(c)return[false,`Wykluczone przez: ${c.n}`];if(!TN[id].par.some(ownN))return[false,'Najpierw odblokuj poprzedni węzeł']}
  if(p.lvl<rqLv(id,r+1))return[false,`Ranga ${r+1} od poziomu ${rqLv(id,r+1)}`];if(p.ps<1)return[false,'Brak punktów drzewka'];return[true,'']}

function treeBranch(b){const ids=Object.keys(TN).filter(id=>id!=='o'&&brOf(id)===b),by={};ids.forEach(id=>(by[dep(id)]=by[dep(id)]||[]).push(id));let h='';

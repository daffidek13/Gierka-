#idet b{font-size:17px}#idet small{display:block;opacity:.7;margin:2px 0 6px}#idet .row{display:flex;gap:8px;margin-top:8px}#idet .row button{flex:1;padding:10px}

function h(x,y,s){let n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vn(x,y,sc,s){const gx=x/sc,gy=y/sc,x0=Math.floor(gx),y0=Math.floor(gy);let fx=gx-x0,fy=gy-y0;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=h(x0,y0,s),b=h(x0+1,y0,s),c=h(x0,y0+1,s),d=h(x0+1,y0+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
const cache=new Map();
function field(x,y){
  const k=x+','+y,s=S.seed+(S.map||0)*7919;if(cache.has(k))return cache.get(k);
  const e=.65*vn(x,y,8,s)+.35*vn(x,y,3,s+1),m=vn(x,y,10,s+2);
  let t=e<.3?'woda':e>.72?'gory':m<.3?'pustynia':m>.7?'bagno':m>.5?'las':'laka';
  if(Math.abs(x)<=1&&Math.abs(y)<=1)t='laka';
  const f={x,y,t,poi:null,foes:[]};
  if(x===0&&y===0)f.poi='miasto';
  else if(t!=='woda'){
    const r=h(x,y,s+10);
    if(r<.1)f.poi='jaskinia';else if(r<.15)f.poi='ruiny';else if(h(x,y,s+13)<.07)f.ch=1;else if(h(x,y,s+14)<.05)f.ev=['kupiec','oltarz','zagadka'][Math.floor(h(x,y,s+15)*3)];
    if(h(x,y,s+11)<.55){
      const n=1+Math.floor(h(x,y,s+12)*3);
      for(let i=0;i<n;i++){
        let list=SP[t],key=list[Math.floor(h(x+i*7,y+i*13,s+20)*list.length)];
        if(t==='gory'&&h(x+i,y,s+30)<.04)key='smok';
        f.foes.push({key,ag:h(x+i*5,y+i*3,s+40)<.4,n:key==='smok'?1:1+Math.floor(h(x+i*3,y+i*11,s+50)*5),px:[20,50,80][(i+Math.floor(h(x,y,s+60)*3))%3]+(h(x+i,y,s+61)-.5)*12,py:48+h(x,y+i,s+62)*32});
      }
    }
  }
  if(S.boss&&!S.boss.dead&&x===S.boss.x&&y===S.boss.y){f.t=f.t==='woda'?'laka':f.t;f.poi=null;f.foes=[{key:'boss',ag:true,n:1,px:50,py:62,boss:1}]}
  cache.set(k,f);return f;
}

const TN={};TR.forEach(r=>TN[r[0]]={id:r[0],n:r[1],par:r[2]?r[2].split(','):[],t:r[3],e:r[4]});
const TD={},TP={};let TW=0,TZ=.8;
const dep=id=>TD[id]??(TD[id]=TN[id].par.length?1+Math.max(...TN[id].par.map(dep)):0);
(function(){const BX={s:-390,z:-130,i:130,w:390},rows={};
  Object.keys(TN).forEach(id=>{(rows[dep(id)]=rows[dep(id)]||[]).push(id)});
  Object.keys(rows).sort((a,b)=>a-b).forEach(d=>{const ids=rows[d];
    ids.forEach(id=>{const n=TN[id];TP[id]={x:!n.par.length?0:n.par[0]==='o'?BX[id[0]]:n.par.reduce((a,q)=>a+TP[q].x,0)/n.par.length,y:14+d*104}});
    ids.sort((a,b)=>TP[a].x-TP[b].x);
    for(let k=0;k<60;k++)for(let i=0;i<ids.length-1;i++){const A=TP[ids[i]],B=TP[ids[i+1]],g=80-(B.x-A.x);if(g>0){A.x-=g/2;B.x+=g/2}}});
  const xs=Object.values(TP).map(p=>p.x),mn=Math.min(...xs);Object.values(TP).forEach(p=>p.x+=40-mn);TW=Math.max(...xs)-mn+100;
})();
const SKL=()=>(S.p.lo||[]).map(id=>TN[id]).filter(Boolean);
function initTree(p){const c={uczony:'i',silacz:'s',atleta:'z'}[p.cls];p.tr=['o',c+'1',c+'2','w1','w2'];p.lo=[c+'2','w2'];p.ps=p.lvl-1}
function effTx(n){if(n.t==='p')return Object.entries(n.e).map(([k,v])=>'+'+v+' '+LB[k]).join(', ')||'Środek drzewka';const e=n.e;return `${{p:'Atak fizyczny',m:'Zaklęcie',h:'Leczenie',b:'Wzmocnienie ataku',s:'Tarcza',r:'Krwawienie (obrażenia w czasie)',d:'Trucizna (obrażenia w czasie)',w:'Osłabienie wroga',u:'Przywołaniec'}[e.t]} · ${e.c} ${e.r==='mana'?'many':'staminy'} · CD ${e.cd}s · ×${e.m}${e.t==='h'||e.t==='s'?'% HP':''}`}
let TSEL=null;
const PSI={sil:'💪',zre:'🌀',int:'🧠',wit:'❤️',def:'🛡️',atkp:'⚔️',hpp:'💖',crit:'🎯',ls:'🩸',dod:'💨',stap:'🔋',manap:'🔷',spp:'✨'};
const tIc=id=>{const n=TN[id];return icon('',`assets/s_${id}.png`,n.t==='a'?(SKI[n.e.t]||'✨'):(PSI[Object.keys(n.e||{})[0]]||'⭐'))};
function showTree(){
  const p=S.p,old=$('tv'),sl=old?[old.scrollLeft,old.scrollTop]:[Math.max(0,TP.o.x*TZ-innerWidth/2),0],own=id=>p.tr.includes(id),av=id=>!own(id)&&TN[id].par.some(own);
  let ln='',nd='',mx=0;const BC={s:'#d2573d',z:'#4fb36e',i:'#4f8fe6',w:'#e0709f',h:'#e0b04a',o:'#e0b04a'};
  Object.keys(TN).forEach(id=>{const n=TN[id],a=TP[id];mx=Math.max(mx,a.y);
    n.par.forEach(q=>{const b=TP[q],on=own(id)&&own(q),ok=own(q)&&av(id),m=(b.y+56+a.y)/2;
      ln+=`<path d="M${b.x} ${b.y+28}C${b.x} ${m},${a.x} ${m},${a.x} ${a.y+28}" fill="none" stroke="${on?'#f0b84a':ok?'#8ccf6a':'#2f333d'}" stroke-width="${on?5:3.5}" stroke-linecap="round"${on?' style="filter:drop-shadow(0 0 4px #f0b84a)"':''}/>`});
    nd+=`<button class="nd${n.t==='a'?' a':''}${own(id)?' own':av(id)?' av':''}${TSEL===id?' sel':''}" data-n="${id}" style="left:${a.x-40}px;top:${a.y}px;--bc:${BC[id[0]]||'#aaa'}"><b class="ndc">${id==='o'?'<em>★</em>':tIc(id)}</b><span>${n.n}</span></button>`});
  const n=TSEL&&TN[TSEL],lo=p.lo.includes(TSEL);
  $('tree').innerHTML=`<button data-a="tx">Zamknij</button> <button data-a="rs">Reset drzewka (${20*p.lvl} zł)</button> <button data-a="zm">−</button><button data-a="zp">+</button><p>Wolne punkty: <b>${p.ps}</b> · pasek walki: ${p.lo.map(i=>TN[i].n).join(', ')||'—'}</p>
  <div id="ti">${n?`<span class="tbig">${tIc(TSEL)}</span><b>${n.n}</b> — ${effTx(n)}<br>${own(TSEL)?(n.t==='a'?`<button data-a="lo">${lo?'Zdejmij z paska':'Dodaj do paska (max 4)'}</button>`:'Odblokowane'):av(TSEL)?`<button data-a="un"${p.ps?'':' disabled'}>Odblokuj (1 pkt)</button>`:'Najpierw odblokuj sąsiedni węzeł'}`:'Tap w węzeł, żeby zobaczyć opis. Okrągłe: pasywki, kwadratowe: umiejętności aktywne.'}</div>
  <div id="tv"><div style="position:relative;zoom:${TZ};width:${TW}px;height:${mx+90}px"><svg width="${TW}" height="${mx+90}" style="position:absolute;inset:0">${ln}</svg>${nd}</div></div>`;
  $('tree').classList.add('on');const t=$('tv');t.scrollLeft=sl[0];t.scrollTop=sl[1];
}
$('tree').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=S.p,a=b.dataset.a;
  if(a==='tx'){$('tree').classList.remove('on');showChar();return}
  if(b.dataset.n)TSEL=b.dataset.n;
  else if(a==='zp')TZ=Math.min(1.4,TZ+.15);else if(a==='zm')TZ=Math.max(.5,TZ-.15);
  else if(a==='un'&&p.ps&&TSEL){const n=TN[TSEL];if(!p.tr.includes(TSEL)&&n.par.some(q=>p.tr.includes(q))){p.ps--;p.tr.push(TSEL);if(n.t==='a'&&p.lo.length<4)p.lo.push(TSEL)}}
  else if(a==='lo'){const i=p.lo.indexOf(TSEL);if(i>=0)p.lo.splice(i,1);else if(p.lo.length<4)p.lo.push(TSEL);else toast('Pasek ma max 4 umiejętności')}
  else if(a==='rs'){const c=20*p.lvl;if(p.gold<c){toast('Za mało złota');return}p.gold-=c;initTree(p)}
  p.hp=Math.min(p.hp,mh());save();showTree()};

S.chs=S.chs||{};S.ground=S.ground||{};S.evs=S.evs||{};S.cnt=S.cnt||{};S.rec=S.rec||{};S.best=S.best||{};S.ach=S.ach||{};if(S.loc&&!S.loc.id)S.loc=null;

if(S.p.lo&&S.p.lo.length>4)S.p.lo.length=4;

if(!S.p.cls)showCls();
